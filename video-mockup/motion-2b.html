<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>3D Cylinder + Elastic Capsule Payment Motion (2-B)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8fafc;
      --card: #ffffff;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --secondary: #f1f5f9;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-6 shadow-sm">
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
      <div>
        <h2 class="text-[var(--foreground)] font-semibold text-base flex items-center gap-2">
          <span>최종 모션: 2-B. 3D 실린더 + 쫀득 캡슐 스트레치</span>
          <span id="state-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-500/15 text-blue-500">
            송금 진행 중...
          </span>
        </h2>
        <p class="text-[var(--muted-foreground)] text-xs mt-0.5">
          원샷 자동 재생뿐만 아니라, 실제 결제창처럼 [로딩 유지 → 원하는 타이밍에 완료] 전환도 지원합니다
        </p>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-oneshot" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#3182f6] text-white hover:opacity-90 transition cursor-pointer">
          ↻ 원샷 모션 재생 (1.3초)
        </button>
        <button id="btn-api-sim" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)] transition cursor-pointer">
          ⚡ 실제 API 대기 시뮬레이션
        </button>
      </div>
    </div>

    <!-- Main Preview Stage -->
    <div class="grid grid-cols-12 gap-4 my-3 items-center">
      <!-- Left: Payment Modal Mockup Card (6 cols) -->
      <div class="col-span-6 flex flex-col items-center justify-center rounded-2xl bg-white border border-[var(--border)] py-5 px-4 shadow-xs">
        <svg viewBox="0 0 200 200" class="w-36 h-36 select-none">
          <defs>
            <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="20%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="edge-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" id="e1" stop-color="#93c5fd" />
              <stop offset="35%" id="e2" stop-color="#eff6ff" />
              <stop offset="70%" id="e3" stop-color="#60a5fa" />
              <stop offset="100%" id="e4" stop-color="#93c5fd" />
            </linearGradient>
          </defs>

          <!-- 3D Extruded Cylinder -->
          <g id="cyl-group">
            <ellipse id="back-cap" cx="100" cy="100" rx="72" ry="72" fill="url(#edge-grad)" />
            <rect id="side-rect" x="100" y="28" width="0" height="144" fill="url(#edge-grad)" />
            <ellipse id="front-rim" cx="100" cy="100" rx="72" ry="72" fill="#d5d8de" />
            <ellipse id="front-face" cx="100" cy="100" rx="65.5" ry="65.5" fill="#e2e5eb" />

            <!-- 2-B Elastic Squash & Stretch Capsules with 3D Z-Parallax -->
            <g id="inner-group" transform="translate(100, 100)">
              <g id="caps-shadow" opacity="0.32"></g>
              <g id="caps-main"></g>
            </g>

            <ellipse id="sheen-el" cx="100" cy="100" rx="72" ry="72" fill="url(#sheen-grad)" opacity="0" />
          </g>

          <!-- Rising Solid Circle -->
          <circle id="rise-circle" cx="100" cy="132" r="30" fill="#3182f6" opacity="0" />

          <!-- Checkmark Stroke -->
          <path
            id="check-path"
            d="M 75.5 101.5 L 92.5 118.5 L 125.5 84.5"
            fill="none"
            stroke="#ffffff"
            stroke-width="8.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-dasharray="72"
            stroke-dashoffset="72"
            opacity="0"
          />
        </svg>

        <div id="payment-title" class="text-sm font-bold text-neutral-800 mt-2">
          송금하는 중이에요
        </div>
        <div id="payment-sub" class="text-xs text-neutral-500 mt-0.5">
          잠시만 기다려 주세요...
        </div>
      </div>

      <!-- Right: Timeline & Controls (6 cols) -->
      <div class="col-span-6 flex flex-col gap-3">
        <div class="rounded-xl border border-[var(--border)] p-3 bg-[var(--secondary)]/30">
          <div class="text-xs font-semibold text-[var(--foreground)] mb-2">
            모션 4단계 타임라인 구성
          </div>
          <div class="space-y-1.5 text-xs text-[var(--muted-foreground)]">
            <div class="flex items-center justify-between">
              <span>① 쿨그레이 → 블루 3D 1차 스핀</span>
              <span class="font-mono">0.00s ~ 0.46s</span>
            </div>
            <div class="flex items-center justify-between">
              <span>② 쫀득 캡슐 웨이브 + 2차 가속 스핀</span>
              <span class="font-mono">0.46s ~ 0.75s</span>
            </div>
            <div class="flex items-center justify-between">
              <span>③ 캡슐 중앙 합체 + 하단 서클 라이징</span>
              <span class="font-mono">0.75s ~ 1.00s</span>
            </div>
            <div class="flex items-center justify-between">
              <span>④ 체크 마크 스트로크 드로잉</span>
              <span class="font-mono">1.00s ~ 1.28s</span>
            </div>
          </div>
        </div>

        <!-- Color Theme Selector -->
        <div class="flex flex-col gap-1.5">
          <span class="text-xs font-medium text-[var(--muted-foreground)]">컬러 테마 변경:</span>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <button data-pal="toss" class="pal-btn py-1.5 px-2.5 rounded-lg font-semibold bg-[#3182f6] text-white cursor-pointer">
              토스 블루 (#3182F6)
            </button>
            <button data-pal="deepblue" class="pal-btn py-1.5 px-2.5 rounded-lg font-medium border border-[var(--border)] text-[var(--foreground)] cursor-pointer">
              네이비 블루 (#1D4ED8)
            </button>
            <button data-pal="mint" class="pal-btn py-1.5 px-2.5 rounded-lg font-medium border border-[var(--border)] text-[var(--foreground)] cursor-pointer">
              에메랄드 민트 (#10B981)
            </button>
            <button data-pal="gold" class="pal-btn py-1.5 px-2.5 rounded-lg font-medium border border-[var(--border)] text-[var(--foreground)] cursor-pointer">
              옐로우 골드 (#FAE62D)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PALETTES = {
      toss: {
        startRim: '#d5d8de', startFace: '#e2e5eb', startSym: '#4b5563',
        midSym: '#2563eb', endRim: '#93c5fd', endFace: '#dbeafe', endSym: '#2563eb',
        symShadow: '#60a5fa', edge1: '#93c5fd', edge2: '#eff6ff', edge3: '#60a5fa',
        circle: '#3182f6', check: '#ffffff',
      },
      deepblue: {
        startRim: '#cbd5e1', startFace: '#e2e8f0', startSym: '#334155',
        midSym: '#1d4ed8', endRim: '#60a5fa', endFace: '#bfdbfe', endSym: '#1e40af',
        symShadow: '#3b82f6', edge1: '#60a5fa', edge2: '#dbeafe', edge3: '#3b82f6',
        circle: '#1d4ed8', check: '#ffffff',
      },
      mint: {
        startRim: '#d5dad8', startFace: '#e2e7e5', startSym: '#4b5563',
        midSym: '#0d9488', endRim: '#6ee7b7', endFace: '#d1fae5', endSym: '#059669',
        symShadow: '#34d399', edge1: '#6ee7b7', edge2: '#ecfdf5', edge3: '#34d399',
        circle: '#10b981', check: '#ffffff',
      },
      gold: {
        startRim: '#d4d5d7', startFace: '#dedfe1', startSym: '#3f434a',
        midSym: '#63392b', endRim: '#e6cf83', endFace: '#f3e19e', endSym: '#de6b15',
        symShadow: '#b89855', edge1: '#e5cd65', edge2: '#f7ea9c', edge3: '#d4b84c',
        circle: '#fae62d', check: '#0b0b0b',
      }
    };

    let pal = PALETTES.toss;
    let startTime = performance.now();
    let isWaitingApi = false;
    let finishTriggerTime = null; // when completion phase begins

    function lerp(a, b, t) {
      return a + (b - a) * Math.max(0, Math.min(1, t));
    }
    function lerpColor(hex1, hex2, t) {
      t = Math.max(0, Math.min(1, t));
      const c1 = parseInt(hex1.slice(1), 16);
      const c2 = parseInt(hex2.slice(1), 16);
      const r = Math.round(lerp((c1 >> 16) & 255, (c2 >> 16) & 255, t));
      const g = Math.round(lerp((c1 >> 8) & 255, (c2 >> 8) & 255, t));
      const b = Math.round(lerp(c1 & 255, c2 & 255, t));
      return `rgb(${r}, ${g}, ${b})`;
    }
    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function buildCapsulesMarkup(color, t, mergeP) {
      const phases = [0, 1.2, 2.4];
      const baseXs = [-27, 0, 27];
      let html = '';
      for (let i = 0; i < 3; i++) {
        const s = Math.sin(t * 12.5 - phases[i]);
        const stretch = Math.abs(Math.cos(t * 12.5 - phases[i]));
        const x = lerp(baseXs[i], 0, mergeP);
        const y = lerp(s * 9, 10, mergeP);
        const w = lerp(16 - stretch * 3.5, 16, mergeP);
        const h = lerp(16 + stretch * 14, 16, mergeP);
        const rx = w / 2;
        html += `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx.toFixed(1)}" fill="${color}" />`;
      }
      return html;
    }

    const cylGroup = document.getElementById('cyl-group');
    const backCap = document.getElementById('back-cap');
    const sideRect = document.getElementById('side-rect');
    const frontRim = document.getElementById('front-rim');
    const frontFace = document.getElementById('front-face');
    const innerGroup = document.getElementById('inner-group');
    const capsShadow = document.getElementById('caps-shadow');
    const capsMain = document.getElementById('caps-main');
    const sheenEl = document.getElementById('sheen-el');
    const riseCircle = document.getElementById('rise-circle');
    const checkPath = document.getElementById('check-path');
    const stateBadge = document.getElementById('state-badge');
    const paymentTitle = document.getElementById('payment-title');
    const paymentSub = document.getElementById('payment-sub');
    const btnApiSim = document.getElementById('btn-api-sim');

    const R = 72;
    const R_INNER = 65.5;
    const THICKNESS = 22;

    function tick(now) {
      const elapsed = (now - startTime) / 1000;
      // Effective transition time (in one-shot mode, transition starts at 0.75s)
      const transStart = isWaitingApi ? finishTriggerTime : 0.75;
      const isFinishing = transStart !== null && elapsed >= transStart;
      const finElapsed = isFinishing ? (elapsed - transStart) : 0;

      // Update UI text
      if (isFinishing && finElapsed > 0.2) {
        stateBadge.textContent = '송금 완료 ✔';
        stateBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-500';
        paymentTitle.textContent = '송금이 완료되었어요!';
        paymentSub.textContent = '상대방 계좌로 안전하게 입금되었습니다';
      } else {
        stateBadge.textContent = '송금 진행 중...';
        stateBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-500/15 text-blue-500';
        paymentTitle.textContent = '송금하는 중이에요';
        paymentSub.textContent = isWaitingApi ? '우측 상단 [승인 완료하기]를 눌러보세요!' : '잠시만 기다려 주세요...';
      }

      // 1. 3D Cylinder rotation angle phi
      let phi = 0;
      if (isWaitingApi && !isFinishing) {
        const cycle = elapsed % 0.44;
        phi = easeInOutCubic(Math.min(1, cycle / 0.38)) * Math.PI;
      } else if (!isWaitingApi) {
        if (elapsed > 0.08 && elapsed <= 0.46) {
          phi = easeInOutCubic((elapsed - 0.08) / 0.38) * Math.PI;
        } else if (elapsed > 0.52 && elapsed <= 0.75) {
          phi = easeInOutCubic((elapsed - 0.52) / 0.23) * Math.PI;
        }
      }

      const sinPhi = Math.sin(phi);
      const cosPhi = Math.cos(phi);
      const absCos = Math.max(0.001, Math.abs(cosPhi));
      const dir = cosPhi >= 0 ? 1 : -1;
      const offset = (THICKNESS / 2) * sinPhi;
      const frontX = 100 + dir * offset;
      const backX = 100 - dir * offset;

      const parallaxX = dir * sinPhi * 5.5;
      const shadowShiftX = -dir * sinPhi * 3.5 + 2;

      const colorT = (elapsed - 0.10) / 0.32;
      const rimColor = lerpColor(pal.startRim, pal.endRim, colorT);
      const faceColor = lerpColor(pal.startFace, pal.endFace, colorT);
      const symColor = elapsed < 0.25
        ? lerpColor(pal.startSym, pal.midSym, (elapsed - 0.08) / 0.17)
        : lerpColor(pal.midSym, pal.endSym, (elapsed - 0.25) / 0.15);

      const edgeT = (elapsed - 0.35) / 0.25;
      document.getElementById('e1').setAttribute('stop-color', lerpColor('#d5d7dc', pal.edge1, edgeT));
      document.getElementById('e2').setAttribute('stop-color', lerpColor('#f1f3f6', pal.edge2, edgeT));
      document.getElementById('e3').setAttribute('stop-color', lerpColor('#b8bcc4', pal.edge3, edgeT));
      document.getElementById('e4').setAttribute('stop-color', lerpColor('#d5d7dc', pal.edge1, edgeT));

      frontRim.setAttribute('cx', frontX);
      frontRim.setAttribute('rx', R * absCos);
      frontRim.setAttribute('fill', rimColor);

      frontFace.setAttribute('cx', frontX);
      frontFace.setAttribute('rx', R_INNER * absCos);
      frontFace.setAttribute('fill', faceColor);

      backCap.setAttribute('cx', backX);
      backCap.setAttribute('rx', R * absCos);

      sideRect.setAttribute('x', Math.min(frontX, backX));
      sideRect.setAttribute('width', Math.max(0.5, Math.abs(frontX - backX)));

      innerGroup.setAttribute('transform', `translate(${(frontX + parallaxX).toFixed(1)}, 100) scale(${absCos}, 1)`);
      capsShadow.setAttribute('transform', `translate(${shadowShiftX.toFixed(1)}, 2.5)`);

      const mergeP = transStart !== null
        ? Math.max(0, Math.min(1, (elapsed - (transStart - 0.07)) / 0.15))
        : 0;

      capsShadow.innerHTML = buildCapsulesMarkup(pal.symShadow, elapsed, mergeP);
      capsMain.innerHTML = buildCapsulesMarkup(symColor, elapsed, mergeP);

      sheenEl.setAttribute('cx', frontX);
      sheenEl.setAttribute('rx', R * absCos);
      sheenEl.setAttribute('opacity', Math.pow(sinPhi, 2) * 0.65);

      riseCircle.setAttribute('fill', pal.circle);
      checkPath.setAttribute('stroke', pal.check);

      if (!isFinishing) {
        cylGroup.setAttribute('opacity', 1);
        riseCircle.setAttribute('opacity', 0);
        checkPath.setAttribute('opacity', 0);
        checkPath.setAttribute('stroke-dashoffset', 72);
      } else {
        const p3 = Math.min(1, finElapsed / 0.22);
        cylGroup.setAttribute('opacity', Math.max(0, 1 - p3 * 1.15));

        const easeP3 = easeOutBack(Math.min(1, finElapsed / 0.24));
        riseCircle.setAttribute('cy', lerp(132, 100, Math.min(1, p3 * 1.1)));
        riseCircle.setAttribute('r', Math.min(73.5, Math.max(24, lerp(30, 72, easeP3))));
        riseCircle.setAttribute('opacity', Math.min(1, finElapsed / 0.08));

        if (finElapsed < 0.27) {
          checkPath.setAttribute('opacity', 0);
          checkPath.setAttribute('stroke-dashoffset', 72);
        } else {
          checkPath.setAttribute('opacity', 1);
          const p4 = Math.min(1, (finElapsed - 0.27) / 0.24);
          const easedP4 = 1 - Math.pow(1 - p4, 2.2);
          checkPath.setAttribute('stroke-dashoffset', 72 * (1 - easedP4));
        }
      }

      requestAnimationFrame(tick);
    }

    document.getElementById('btn-oneshot').addEventListener('click', () => {
      isWaitingApi = false;
      finishTriggerTime = null;
      btnApiSim.textContent = '⚡ 실제 API 대기 시뮬레이션';
      btnApiSim.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)] transition cursor-pointer';
      startTime = performance.now();
    });

    btnApiSim.addEventListener('click', () => {
      if (!isWaitingApi || finishTriggerTime !== null) {
        // Start infinite loading state
        isWaitingApi = true;
        finishTriggerTime = null;
        startTime = performance.now();
        btnApiSim.textContent = '✔ 지금 승인 완료 트리거!';
        btnApiSim.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-white hover:bg-emerald-400 transition cursor-pointer';
      } else {
        // Trigger smooth completion from current time!
        finishTriggerTime = (performance.now() - startTime) / 1000;
        btnApiSim.textContent = '⚡ 다시 API 대기 시작';
        btnApiSim.className = 'px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)] transition cursor-pointer';
      }
    });

    document.querySelectorAll('.pal-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        pal = PALETTES[btn.dataset.pal];
        document.querySelectorAll('.pal-btn').forEach((b) => {
          b.className = 'pal-btn py-1.5 px-2.5 rounded-lg font-medium border border-[var(--border)] text-[var(--foreground)] cursor-pointer';
        });
        btn.className = 'pal-btn py-1.5 px-2.5 rounded-lg font-semibold bg-[#3182f6] text-white cursor-pointer';
        isWaitingApi = false;
        finishTriggerTime = null;
        startTime = performance.now();
      });
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>

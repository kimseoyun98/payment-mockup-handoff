<title>결제 목업 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 부스 데모 4번 폰 목업(Figma Mobile-white) 속 결제 시퀀스. 화면 = 퍼즐 프로젝트 스토리보드 1~6 (assets/sb1~6.png, 390×844 @4x = 1560×3376, 4K 키오스크 기준) */
:root{--bg:#E9EDF5}
body{background:var(--bg);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
/* ===== 목업 (단위: Figma Mobile-white 좌표 = 기기 136×274, 화면 126 폭) ===== */
.stage{position:relative;width:calc(150px * var(--k));height:calc(292px * var(--k));--k:2.4;max-width:100%}
/* 확대는 transform 대신 zoom: 화면 이미지끼리 반올림 오차로 몇 px씩 어긋나지 않게 */
.dev{position:absolute;left:0;top:0;width:150px;height:292px;zoom:var(--k)}
.phone{position:absolute;left:7px;top:7px;width:136px;height:274px;border-radius:19.88px;background:#fff;
  box-shadow:.35px 1.39px 8.37px rgba(0,0,0,.35),inset -1.39px -3.14px 2.44px rgba(0,0,0,.19)}
.scr{position:absolute;left:5px;top:4px;width:126px;height:265px;border-radius:14px;overflow:hidden;background:#fff}
.spk{position:absolute;left:47.08px;top:3.84px;width:41.85px;height:9.07px;border-radius:0 0 10.46px 10.46px;background:#fff}
.spk i{position:absolute;left:10.81px;top:3.48px;width:18.83px;height:1.39px;border-radius:2.79px;background:#CFCFCF}
.spk b{position:absolute;left:31.03px;top:3.48px;width:1.39px;height:1.39px;border-radius:50%;background:#CFCFCF}
.scr .L{position:absolute}
.scr img.L{left:0;width:126px}
.sk,.sk i{position:absolute}
.sk{left:0;right:0;bottom:0;background:#fff;overflow:hidden;isolation:isolate}
.sk i{display:block;background:#EEF0F3}
.sheet,.scroll{position:absolute;overflow:hidden}
.scroll{background:#fff}
.scroll .in{position:absolute;left:0;top:0}
.scroll img,.sheet img{position:absolute;width:126px}
.load{position:absolute;background:#fff;border-radius:50%}
.load svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hand{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(46,107,242,.22);box-shadow:0 0 0 .6px rgba(46,107,242,.5) inset;opacity:0;pointer-events:none}
.sb{position:absolute;left:-1px;top:-2px;width:128px;height:13px;background:#fff}
.white{position:absolute;inset:0;background:#fff;opacity:0}
/* 확인용 언어 버튼 (실제 앱에서는 setLang 호출로 대체) */
/* 부스 화면(booth-motion) 4번 폰 목업 안에 끼워 넣을 때 (?embed): 목업 화면(126 × 265)만 창에 꽉 차게, 언어 버튼 없음 */
html.embed body{display:block;min-height:0;padding:0;background:transparent;overflow:hidden}
html.embed #lang,html.embed .spk{display:none}

</style>

<script>
/* ?embed: 부스 화면이 불러올 때. 스스로 재생하지 않고 부스가 보내는 메시지로만 움직임
   {type:'video-mockup:play', lang:'ko'|'en'} 처음부터 1회 재생 → 결제 성공까지 끝나면 부모에 {type:'video-mockup:end'}
   {type:'video-mockup:stop'} 멈추고 첫 화면(스켈레톤)으로 */
const EMBED=new URLSearchParams(location.search).has('embed');
if(EMBED)document.documentElement.classList.add('embed');
/* ---------- 좌표: 스토리보드(390×844) → 목업 화면(126 폭) ---------- */
const S=126/390, Y=y=>11-47*S+y*S, X=x=>x*S, f=v=>v*S;
// 터치 좌표. EN은 사이드바 "South Korea"가 두 줄이라 한국 탭 위치만 다름 (화면 구조는 KR과 동일)
const PT_KO={tab:[195,313.5],kr:[51,520.5],tile:[158,521],chk:[30,718],pay:[195,773],load5:[170,335],load6:[169.5,237]};
const PT_EN={...PT_KO,kr:[51,552]};
let LANG=new URLSearchParams(location.search).get('lang')==='en'?'en':'ko', PT=LANG==='en'?PT_EN:PT_KO;
const SHT=698, SC=205;
const EZ={move:'cubic-bezier(0.65,0,0.35,1)',decel:'cubic-bezier(0.16,1,0.3,1)',out:'cubic-bezier(0.55,0,1,0.45)',in:'cubic-bezier(0.22,1,0.36,1)'};

/* ---------- 레이어 만들기 ---------- */
const scr=document.getElementById('scr');
const el=(tag,cls,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);return e;};
// 화면 이미지: 언어별 파일(sbN.png / sbN-en.png)을 IMGS에 등록해 두고 setLang에서 한 번에 교체
const IMGS=[];
const img=(n,style,cls)=>{const i=el('img',cls,style);i.dataset.n=n;i.alt='';IMGS.push(i);return i;};
const srcOf=n=>`assets/sb${n}${LANG==='en'?'-en':''}.png`;
const shot=(n,extra)=>img(n,{top:Y(0)+'px',height:f(844)+'px',clipPath:`inset(${f(47)}px 0 0 0)`,...extra},'L');
const L={};
L.s1=shot(1);L.s2=shot(2,{opacity:0});
// 우측 목록 스크롤 레이어 (sb2 위쪽 + sb3로 아래 이어 붙임)
L.scroll=el('div','scroll',{left:X(102)+'px',top:Y(335)+'px',right:0,bottom:0,opacity:0});
const inn=el('div','in',{width:'126px'});
// 목록 전체(글로벌~인도네시아, Figma 260×724 @4x): 화면 x 116, y 349부터
const sa=img('-list',{left:f(14)+'px',top:f(14)+'px',width:f(260)+'px',height:f(724)+'px'});
inn.append(sa);L.scroll.append(inn);L.scrollIn=inn;
L.side=shot(3,{clipPath:`inset(${f(335)}px ${f(390-102)}px ${f(844-SHT)}px 0)`,opacity:0});

// 하단 CTA 시트
L.sheet=el('div','sheet',{left:0,top:Y(SHT)+'px',width:'126px',height:f(844-SHT)+'px',transform:`translateY(${f(844-SHT)}px)`});
const sh3=img(3,{left:0,top:f(-SHT)+'px',height:f(844)+'px'});
const sh4=img(4,{left:0,top:f(-SHT)+'px',height:f(844)+'px',opacity:0});
L.sheet.append(sh3,sh4);L.sh4=sh4;
// [결제하기] 버튼만 따로 떼어 눌림 모션 (원래 버튼 자리는 흰 바탕으로 가리고, 그 위에 같은 버튼을 얹음). 버튼 = 화면 x 20~370, y 742~804
L.btn=el('div',null,{position:'absolute',left:f(18)+'px',top:f(742-SHT-2)+'px',width:f(354)+'px',height:f(66)+'px',background:'#fff'});
L.btnIn=el('div',null,{position:'absolute',left:f(2)+'px',top:f(2)+'px',width:f(350)+'px',height:f(62)+'px',overflow:'hidden',borderRadius:f(12)+'px'});
const bi=img(4,{left:-f(20)+'px',top:-f(742)+'px',height:f(844)+'px'});
L.btnIn.append(bi);L.btn.append(L.btnIn);L.sheet.append(L.btn);
// 스켈레톤 (상단 로고 줄 아래 전체)
const T=100;L.sk=el('div','sk',{top:Y(T)+'px'});
[['#F5F5F6',0,157,390,126,0,1],['#EEEFF1',0,437,390,14,0,1],[0,20,115,72,16,4],[0,290,115,80,16,4],
 ['#E6E8EB',21,168,348,47,8],['#E6E8EB',21,224,171,47,8],['#E6E8EB',198,224,171,47,8],
 [0,50,306,50,14,4],[0,170,306,50,14,4],[0,290,306,50,14,4],[0,21,356,168,60,8],[0,201,356,168,60,8],
 [0,21,472,112,60,8],[0,139,472,112,60,8],[0,257,472,112,60,8],[0,21,542,112,60,8],[0,139,542,112,60,8],[0,257,542,112,60,8],
 [0,21,612,112,60,8],[0,139,612,112,60,8],[0,257,612,112,60,8],[0,21,690,348,47,8],[0,21,756,348,47,8]]
 .forEach(([c,x,y,w,h,r,bg])=>L.sk.append(el('i',null,{left:f(x)+'px',top:f(y-T)+'px',width:f(w)+'px',height:f(h)+'px',borderRadius:f(r)+'px',...(c?{background:c}:{}),...(bg?{zIndex:-1}:{})})));

L.s5=shot(5,{opacity:0});L.s6=shot(6);
// 2-B: 3D 실린더 + 쫀득 캡슐 스트레치 → 캡슐 중앙 합체 + 하단 서클 라이징 + 체크 드로잉
function create2BMotionSVG(uid,stone=false){
  return `<svg viewBox="26 26 148 148" aria-hidden="true">
    <defs>${stone?`
      <radialGradient id="st-${uid}" cx="50%" cy="0%" r="100%">
        <stop offset="0" stop-color="#5677e4"/>
        <stop offset=".6" stop-color="#3C62DD"/>
        <stop offset="1" stop-color="#3559d2"/>
      </radialGradient>
      <radialGradient id="sp-${uid}">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sd-${uid}">
        <stop offset=".8" stop-color="#14205a" stop-opacity=".14"/>
        <stop offset="1" stop-color="#14205a" stop-opacity="0"/>
      </radialGradient>`:''}
      <linearGradient id="sh-${uid}" x1="0%" y1="0%" x2="100%" y2="20%">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ed-${uid}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" class="e1" stop-color="#93c5fd"/>
        <stop offset="35%" class="e2" stop-color="#eff6ff"/>
        <stop offset="70%" class="e3" stop-color="#60a5fa"/>
        <stop offset="100%" class="e4" stop-color="#93c5fd"/>
      </linearGradient>
    </defs>
    <g class="cyl">
      <ellipse class="back" cx="100" cy="100" rx="72" ry="72" fill="url(#ed-${uid})"/>
      <rect class="side" x="100" y="28" width="0" height="144" fill="url(#ed-${uid})"/>
      <ellipse class="rim" cx="100" cy="100" rx="72" ry="72" fill="#d5d8de"/>
      <ellipse class="face" cx="100" cy="100" rx="65.5" ry="65.5" fill="#e2e5eb"/>
      <g class="inner" transform="translate(100,100)">
        <g class="caps-sh" opacity=".32"></g>
        <g class="caps-mn"></g>
      </g>
      <ellipse class="sheen" cx="100" cy="100" rx="72" ry="72" fill="url(#sh-${uid})" opacity="0"/>
    </g>
    ${stone?`<ellipse class="rise-sd" cx="100" cy="132" rx="30" ry="30" fill="url(#sd-${uid})" opacity="0"/>`:''}
    <circle class="rise" cx="100" cy="132" r="30" fill="${stone?`url(#st-${uid})`:'#3C62DD'}" opacity="0"/>
    ${stone?`<ellipse class="rise-sp" cx="100" cy="132" rx="10" ry="6" fill="url(#sp-${uid})" opacity="0"/>
    <path class="chk-sd" d="M 75.5 101.5 L 92.5 118.5 L 125.5 84.5" transform="translate(0 1.5)" fill="none" stroke="#14205a" stroke-opacity=".15" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="72" stroke-dashoffset="72" opacity="0"/>`:''}
    <path class="chk" d="M 75.5 101.5 L 92.5 118.5 L 125.5 84.5" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="72" stroke-dashoffset="72" opacity="0"/>
  </svg>`;
}
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
function lerpColor(h1,h2,t){
  t=Math.max(0,Math.min(1,t));
  const c1=parseInt(h1.slice(1),16),c2=parseInt(h2.slice(1),16);
  return `rgb(${Math.round(lerp((c1>>16)&255,(c2>>16)&255,t))},${Math.round(lerp((c1>>8)&255,(c2>>8)&255,t))},${Math.round(lerp(c1&255,c2&255,t))})`;
}
const easeCube=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function capsHTML(col,t,mp){
  const ph=[0,1.2,2.4],xs=[-27,0,27];let h='';
  for(let i=0;i<3;i++){
    const s=Math.sin(t*12.5-ph[i]),st=Math.abs(Math.cos(t*12.5-ph[i]));
    const x=lerp(xs[i],0,mp),y=lerp(s*9,10,mp),w=lerp(16-st*3.5,16,mp),ht=lerp(16+st*14,16,mp);
    h+=`<rect x="${(x-w/2).toFixed(1)}" y="${(y-ht/2).toFixed(1)}" width="${w.toFixed(1)}" height="${ht.toFixed(1)}" rx="${(w/2).toFixed(1)}" fill="${col}"/>`;
  }
  return h;
}
function render2B(root,t,finStart){
  const isFin=finStart!==null&&t>=finStart,fe=isFin?t-finStart:0;
  let phi=0;
  if(!isFin){
    if(t>.08&&t<=.46)phi=easeCube((t-.08)/.38)*Math.PI;
    else if(t>.46){const cyc=(t-.46)%.44;phi=easeCube(Math.min(1,cyc/.38))*Math.PI;}
  }
  const sP=Math.sin(phi),cP=Math.cos(phi),aC=Math.max(.001,Math.abs(cP)),dir=cP>=0?1:-1;
  const off=11*sP,fX=100+dir*off,bX=100-dir*off,pX=dir*sP*5.5,shX=-dir*sP*3.5+2;
  const cT=(t-.1)/.32;
  const rimC=lerpColor('#d5d8de','#93c5fd',cT),faceC=lerpColor('#e2e5eb','#dbeafe',cT);
  const symC=t<.25?lerpColor('#4b5563','#2563eb',(t-.08)/.17):lerpColor('#2563eb','#3C62DD',(t-.25)/.15);
  const eT=(t-.35)/.25,e1=lerpColor('#d5d7dc','#93c5fd',eT),e2=lerpColor('#f1f3f6','#eff6ff',eT),e3=lerpColor('#b8bcc4','#60a5fa',eT);
  root.querySelector('.e1').setAttribute('stop-color',e1);
  root.querySelector('.e2').setAttribute('stop-color',e2);
  root.querySelector('.e3').setAttribute('stop-color',e3);
  root.querySelector('.e4').setAttribute('stop-color',e1);
  const rim=root.querySelector('.rim'),face=root.querySelector('.face'),back=root.querySelector('.back'),side=root.querySelector('.side');
  rim.setAttribute('cx',fX);rim.setAttribute('rx',72*aC);rim.setAttribute('fill',rimC);
  face.setAttribute('cx',fX);face.setAttribute('rx',65.5*aC);face.setAttribute('fill',faceC);
  back.setAttribute('cx',bX);back.setAttribute('rx',72*aC);
  side.setAttribute('x',Math.min(fX,bX));side.setAttribute('width',Math.max(.5,Math.abs(fX-bX)));
  root.querySelector('.inner').setAttribute('transform',`translate(${(fX+pX).toFixed(1)},100) scale(${aC},1)`);
  const cSh=root.querySelector('.caps-sh'),cMn=root.querySelector('.caps-mn');
  cSh.setAttribute('transform',`translate(${shX.toFixed(1)},2.5)`);
  const mp=finStart!==null?Math.max(0,Math.min(1,(t-(finStart-.07))/.15)):0;
  cSh.innerHTML=capsHTML('#60a5fa',t,mp);cMn.innerHTML=capsHTML(symC,t,mp);
  const sh=root.querySelector('.sheen');sh.setAttribute('cx',fX);sh.setAttribute('rx',72*aC);sh.setAttribute('opacity',Math.pow(sP,2)*.65);
  const cyl=root.querySelector('.cyl'),rise=root.querySelector('.rise'),chk=root.querySelector('.chk');
  if(!isFin){
    cyl.setAttribute('opacity',1);rise.setAttribute('opacity',0);chk.setAttribute('opacity',0);chk.setAttribute('stroke-dashoffset',72);
  }else{
    const p3=Math.min(1,fe/.22);cyl.setAttribute('opacity',Math.max(0,1-p3*1.15));
    const eb=easeBack(Math.min(1,fe/.24));
    rise.setAttribute('cy',lerp(132,100,Math.min(1,p3*1.1)));
    rise.setAttribute('r',Math.min(73.5,Math.max(24,lerp(30,72,eb))));
    rise.setAttribute('opacity',Math.min(1,fe/.08));
    if(fe<.25){chk.setAttribute('opacity',0);chk.setAttribute('stroke-dashoffset',72);}
    else{chk.setAttribute('opacity',1);const p4=Math.min(1,(fe-.25)/.24);chk.setAttribute('stroke-dashoffset',72*(1-(1-Math.pow(1-p4,2.2))));}
  }
  stone2B(root,isFin);
}
/* 결제 성공 원 바둑알 질감 (create2BMotionSVG(uid,true)일 때만): 원을 따라 반사광(왼쪽 위) · 바닥 그림자 · 체크 그림자 */
function stone2B(root,isFin){
  const sp=root.querySelector('.rise-sp');if(!sp)return;
  const rise=root.querySelector('.rise'),sd=root.querySelector('.rise-sd'),csd=root.querySelector('.chk-sd'),chk=root.querySelector('.chk');
  if(!isFin){[sp,sd,csd].forEach(e=>e.setAttribute('opacity',0));return;}
  const cy=+rise.getAttribute('cy'),r=+rise.getAttribute('r'),o=+rise.getAttribute('opacity');
  sp.setAttribute('cx',100);sp.setAttribute('cy',cy-r*.62);sp.setAttribute('rx',r*.62);sp.setAttribute('ry',r*.28);sp.setAttribute('opacity',o*.35); // 위쪽에 넓고 옅은 빛만 (가운데가 볼록해 보이지 않게)
  sd.setAttribute('cy',cy+r*.06);sd.setAttribute('rx',r*1.04);sd.setAttribute('ry',r*1.02);sd.setAttribute('opacity',o);
  csd.setAttribute('opacity',chk.getAttribute('opacity'));csd.setAttribute('stroke-dashoffset',chk.getAttribute('stroke-dashoffset'));
}
L.load=el('div','load',{width:f(55)+'px',height:f(55)+'px',opacity:0});
L.load.innerHTML=create2BMotionSVG('ld');
L.ok=el('div','load',{width:f(55)+'px',height:f(55)+'px',left:X(PT.load6[0]-2)+'px',top:Y(PT.load6[1]-2)+'px',opacity:1});
L.ok.innerHTML=create2BMotionSVG('ok',!EMBED); // 결제 성공 체크 원: 바둑알 질감은 단독 페이지에서만 (부스 ?embed는 기존 평면 원)
L.g6=el('div',null,{position:'absolute',inset:0,opacity:0});L.g6.append(L.s6,L.ok);
L.sb=el('div','sb');L.hand=el('div','hand');L.white=el('div','white');
scr.append(L.s1,L.s2,L.scroll,L.side,L.s3,L.sheet,L.sk,L.s5,L.g6,L.load,L.sb,L.hand,L.white);
IMGS.forEach(i=>i.src=srcOf(i.dataset.n));
// 다른 언어 이미지도 미리 받아 둬서 전환 직후 빈 화면이 안 보이게
['1','2','3','4','5','6','-list'].forEach(n=>{new Image().src=`assets/sb${n}${LANG==='en'?'':'-en'}.png`;});

/* ---------- 스케일 ---------- */
const stage=document.getElementById('stage'),dev=document.getElementById('dev');
const fit=()=>{if(EMBED){stage.style.setProperty('--k',innerWidth/126);return;}const w=Math.min(innerWidth-32,innerHeight*150/292-32,420);stage.style.setProperty('--k',w/150);};
fit();addEventListener('resize',fit);

/* ---------- 재생 엔진 ---------- */
let gen=0;const anims=new Set();
// 애니메이션이 끝나면 최종 값을 인라인 스타일로 고정하고 애니메이션은 지움 → 끝난 뒤에도 따로 떼어 그려지지 않아 모든 화면이 같은 선명도로 보임
const SETTLED=[];
function settle(a){const el=a.effect.target;const props=[...new Set(a.effect.getKeyframes().flatMap(k=>Object.keys(k)).filter(p=>!['offset','easing','composite','computedOffset'].includes(p)))].map(p=>p.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()));
  a.finished.then(()=>{props.forEach(p=>SETTLED.push([el,p,el.style.getPropertyValue(p)]));a.commitStyles();a.cancel();}).catch(()=>{});return a;}
function unsettle(){while(SETTLED.length){const [el,p,v]=SETTLED.pop();if(v)el.style.setProperty(p,v);else el.style.removeProperty(p);}}
// 재생 속도: SPEED배 빠르게 (모든 애니메이션·대기·캡슐 모션에 공통 적용)
const SPEED=2;
const A=(e,kf,dur,delay=0,ez='in',opt={})=>{const a=e.animate(kf,{duration:dur/SPEED,delay:delay/SPEED,easing:EZ[ez]||ez,fill:'both',...opt});anims.add(a);if(opt.iterations!==Infinity)settle(a);return a;};
const wait=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const P=([x,y])=>({left:X(x)+'px',top:Y(y)+'px'});
const LP=([x,y])=>({left:X(x)+'px',top:Y(y)+'px'});

/* ---------- 시퀀스 ---------- */
let cur;
const show=(e,d)=>A(e,[{opacity:0},{opacity:1}],d,0,'move');
const moveTo=async(pt,d)=>{A(L.hand,[{...P(cur),opacity:1},{...P(pt),opacity:1}],d,0,'move');cur=pt;await wait(d+64);};
const press=async fn=>{A(L.hand,[{...P(cur),opacity:1,transform:'scale(1)'},{...P(cur),opacity:1,transform:'scale(.8)'}],104);if(fn)fn();await wait(128);
  A(L.hand,[{...P(cur),opacity:1,transform:'scale(.8)'},{...P(cur),opacity:1,transform:'scale(1)'}],128,0,'decel');await wait(160);};
function reset(){anims.forEach(a=>a.cancel());anims.clear();unsettle();}
async function run(){
  const g=++gen;const alive=()=>g===gen;reset();
  // 스켈레톤: 블록이 은은하게 숨쉬듯 옅어졌다 돌아옴 (배경 영역 제외)
  const pulse=[...L.sk.children].filter(b=>b.style.zIndex!=='-1').map(b=>A(b,[{opacity:1},{opacity:.55},{opacity:1}],1400,0,'ease-in-out',{iterations:Infinity}));
  await wait(1120);if(!alive())return;A(L.sk,[{opacity:1},{opacity:0}],280,0,'move');await wait(480);
  pulse.forEach(a=>a.cancel());if(!alive())return; // 스켈레톤이 사라지면 깜빡임도 멈춤
  cur=PT.tab;A(L.hand,[{...P(cur),opacity:0,transform:'scale(1.5)'},{...P(cur),opacity:1,transform:'scale(1)'}],224,0,'decel');await wait(304);
  await press(()=>show(L.s2,200));await wait(240);if(!alive())return;
  await moveTo(PT.kr,440);// 누르는 순간 바로 스크롤 시작 (빠르게 출발해 부드럽게 멈춤), 한국 아래로 인도네시아가 이어서 보임
  // 스크롤은 transform 대신 top으로: 멈춘 뒤 다른 화면과 같은 선명도로 그려지게
  await press(()=>{show(L.side,160);A(L.scroll,[{opacity:1},{opacity:1}],1);A(L.scrollIn,[{top:'0px'},{top:`${-f(SC)}px`}],560,0,'in');});
  await wait(480);if(!alive())return;
  await moveTo(PT.tile,480);await press(()=>show(L.s3,120));
  A(L.sheet,[{transform:`translateY(${f(844-SHT)}px)`},{transform:'translateY(0)'}],360,0,'decel');await wait(440);if(!alive())return;
  await moveTo(PT.chk,520);await press(()=>show(L.sh4,120));await wait(120);if(!alive())return;
  await moveTo(PT.pay,400);await press(()=>A(L.btnIn,[{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}],240,0,'move'));
  A(L.hand,[{...P(cur),opacity:1},{...P(cur),opacity:0}],160,0,'out');
  show(L.s5,240);
  const lp5={left:X(PT.load5[0]-2)+'px',top:Y(PT.load5[1]-2)+'px'};
  A(L.load,[{...lp5,opacity:0},{...lp5,opacity:1}],240,0,'move');
  const t0=performance.now();
  let raf5=true;
  // 결제 진행 중은 SPEED와 별개로 천천히: 첫 회전(0.46s) + 회전 2번(0.44s×2) = 모션 1.34s를 0.75배속으로 재생 (실제 약 1.8초)
  const LOAD_RATE=.75,LOAD_T=.46+.44*2;
  (function loop5(now){if(!alive()||!raf5)return;render2B(L.load,Math.min(LOAD_T,(now-t0)/1000*LOAD_RATE),null);requestAnimationFrame(loop5);})(t0);
  await new Promise(r=>setTimeout(r,LOAD_T/LOAD_RATE*1000));if(!alive())return;
  raf5=false;
  // 결제 진행 중 → 결제 성공: 화면 교차 페이드 후 6번 자리에서 3D 캡슐 중앙 합체 + 하단 서클 라이징 + 체크 드로잉
  A(L.load,[{...lp5,opacity:1},{...lp5,opacity:0}],160,0,'out');show(L.g6,280);
  const t1=performance.now();
  let raf6=true;
  (function loop6(now){if(!alive()||!raf6)return;render2B(L.ok,.48+(now-t1)/1000*SPEED,.72);requestAnimationFrame(loop6);})(t1);
  await wait(1650);raf6=false;if(!alive())return;
  if(EMBED){parent.postMessage({type:'video-mockup:end'},'*');return;} // 마지막 흰 화면 전환은 부스 쪽에서
  A(L.white,[{opacity:0},{opacity:1}],720,0,'move');await wait(880+800);if(!alive())return;
  run();
}
/* ---------- 언어 전환: setLang('ko'|'en') → 이미지·좌표 교체 후 처음부터 다시 재생 ---------- */
async function setLang(l){
  LANG=l==='en'?'en':'ko';PT=LANG==='en'?PT_EN:PT_KO;gen++;reset();
  IMGS.forEach(i=>i.src=srcOf(i.dataset.n));
  await Promise.all(IMGS.map(i=>i.decode().catch(()=>{})));
  langBtn.textContent=LANG==='en'?'EN':'KR';run();
}
const langBtn=document.getElementById('lang');langBtn.textContent=LANG==='en'?'EN':'KR';
langBtn.addEventListener('click',e=>{e.stopPropagation();setLang(LANG==='en'?'ko':'en');});
if(EMBED)addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='video-mockup:play')setLang(d.lang);
  if(d.type==='video-mockup:stop'){gen++;reset();}});
else{document.getElementById('stage').addEventListener('click',run); // 목업을 누르면 처음부터 다시
  run();}
</script>
